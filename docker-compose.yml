version: "3.9"

services:
  cloud:
    build:
      context: ./cloud_server
      dockerfile: Dockerfile
    image: airtest-cloud:latest
    container_name: airtest-cloud
    ports:
      - "${CLOUD_PORT:-8081}:8081"
    volumes:
      - ./cloud_server/storage:/app/cloud_server/storage
      - ./web_ui/dist:/app/web_ui/dist:ro
    restart: unless-stopped

  web:
    build:
      context: ./web_ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8081}
        VITE_WS_BASE: ${VITE_WS_BASE:-ws://localhost:8081}
    image: airtest-web:latest
    container_name: airtest-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - cloud
    restart: unless-stopped
