<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperRescuer User Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">SuperRescuer Console</div>
    <div class="session">
      <a class="ghost link-button" href="index.html">Console</a>
      <a class="ghost link-button" href="audit.html">Audit Log</a>
      <span id="sessionUser"></span>
      <button id="logoutButton" class="ghost">Sign Out</button>
    </div>
  </header>

  <main class="layout single">
    <section class="column wide">
      <div class="card">
        <h2>User Management</h2>
        <div id="userManagementHint" class="muted"></div>

        <div id="userManagementBody">
          <div class="user-form">
            <h3 id="userFormTitle" style="font-size: 16px; margin: 0 0 10px;">Create New User</h3>
            <input id="newUsername" type="text" placeholder="Username" />
            <input id="newPassword" type="password" placeholder="Password (leave empty to keep current)" />
            <select id="newRole">
              <option value="operator">operator</option>
              <option value="admin">admin</option>
            </select>
            <div class="inline-actions">
              <button id="saveUserButton">Create User</button>
              <button id="cancelEditUserButton" class="ghost hidden">Cancel</button>
            </div>
            <div id="saveUserStatus" class="muted"></div>
          </div>

          <div style="margin: 24px 0 16px; border-bottom: 1px solid var(--border);"></div>

          <h3 style="font-size: 16px; margin: 0 0 12px;">Existing Users</h3>
          <div id="userList" class="list"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="user-management.js"></script>
</body>
</html>
